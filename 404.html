<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#0b1020">
  <link rel="icon" href="./icon.svg">
  <title>找不到頁面｜WatchTogether</title>
  <link rel="stylesheet" href="./src/css/styles.css?v=20260925-formal-v54">
  <link rel="stylesheet" href="./src/css/enhancements.css?v=20260925-formal-v54">
<script>
(() => {
  const path = window.location.pathname.replace(/\/+$/, "");
  if (path === "/WatchTogether/admin.html") {
    window.location.replace("./admin/admin.html");
  }
})();
</script>
</head>
<body data-wt-theme="aurora">
  <main class="view" style="min-height:100dvh;display:grid;place-items:center;padding:24px;">
    <section class="panel" style="width:min(680px,100%);padding:32px;text-align:center;">
      <div class="hero-badge">WATCHTOGETHER</div>
      <h1 style="font-size:clamp(42px,10vw,88px);margin:16px 0 4px;">404</h1>
      <h2 style="margin:0 0 12px;">這個頁面不存在</h2>
      <p class="muted" style="line-height:1.7;">房間可能已離開、網址輸入錯誤，或這個頁面已被移除。</p>
      <a href="./" class="primary-btn" style="display:inline-flex;align-items:center;justify-content:center;margin-top:12px;text-decoration:none;">回到 WatchTogether</a>
    </section>
  </main>
</body>
</html>
