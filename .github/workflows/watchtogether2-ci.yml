name: WatchTogether 2.0 CI

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail
          for f in \
            src/js/app.js \
            src/js/enhancements.js \
            src/js/chat.js \
            src/js/i18n.js \
            src/js/bug-monitor.js \
            src/js/watchtogether2.js \
            src/js/translation.js \
            src/js/ai-core.js \
            admin/admin.js \
            admin/admin2.js
          do
            echo "Checking $f"
            node --check "$f"
          done
          for f in \
            workers/youtube-search.js \
            workers/admin-control/admin-control.js
          do
            echo "Checking Worker ESM: $f"
            node --input-type=module --check < "$f"
          done

      - name: Validate JSON configuration
        run: |
          python - <<'PY'
          import json
          for path in ["config/database.rules.json","manifest.webmanifest","package.json"]:
              print("Checking", path)
              with open(path, encoding="utf-8") as f:
                  json.load(f)
          PY

      - name: Install test dependencies
        run: npm install --no-audit --no-fund
      - name: Run Firebase Rules tests
        run: npm run test:rules
