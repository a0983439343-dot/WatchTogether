name: WatchTogether 2.0 CI

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check JavaScript syntax
        run: |
          node <<'NODE'
          const fs = require('fs');
          const common = [
            'src/js/app.js',
            'src/js/enhancements.js',
            'src/js/chat.js',
            'src/js/i18n.js',
            'src/js/bug-monitor.js',
            'src/js/watchtogether2.js',
            'admin/admin.js',
            'admin/admin2.js'
          ];
          const esm = [
            'workers/youtube-search.js',
            'workers/admin-control/admin-control.js'
          ];
          for (const file of [...common, ...esm]) {
            let source = fs.readFileSync(file, 'utf8');
            if (esm.includes(file)) source = source.replace('export default {', 'const __worker = {');
            try {
              new Function(source);
              console.log('Syntax OK:', file);
            } catch (error) {
              console.error('Syntax ERROR:', file);
              console.error(error.message);
              process.exitCode = 1;
            }
          }
          NODE
      - name: Validate JSON configuration
        run: |
          python - <<'PY'
          import json
          for path in ["config/database.rules.json","manifest.webmanifest","package.json"]:
              print("Checking", path)
              with open(path, encoding="utf-8") as f:
                  json.load(f)
          PY
