name: Validate WatchTogether

on:
  push:
    branches:
      - main
    paths-ignore:
      - "ci-status/**"
  pull_request:
    branches:
      - main

concurrency:
  group: watchtogether-validate
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Java 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      - name: Check access control core syntax
        run: node --check src/js/access-control.js

      - name: Check room access module syntax
        run: node --check src/js/room-access.js

      - name: Check src/js/app.js syntax
        run: node --check src/js/app.js

      - name: Check src/js/enhancements.js syntax
        run: node --check src/js/enhancements.js

      - name: Check automatic bug monitor syntax
        run: node --check src/js/bug-monitor.js

      - name: Check admin page syntax
        run: node --check admin/admin.js

      - name: Check autonomous repair syntax
        run: node --check scripts/autonomous-repair.mjs

      - name: Check src/js/chat.js syntax
        run: node --check src/js/chat.js

      - name: Check expanded feature pack syntax
        run: node --check src/js/feature-pack.js

      - name: Check feature completion syntax
        run: node --check src/js/feature-completion.js
      - name: Check feature completion v2 syntax
        run: node --check src/js/feature-completion-v2.js

      - name: Check feature completion v3 syntax
        run: node --check src/js/feature-complete-v3.js
      - name: Check feature completion v5 syntax
        run: node --check src/js/feature-complete-v5.js

      - name: Check room chat rich module syntax
        run: node --check src/js/room-chat-rich.js
      - name: Check cloud completion runtime references
        run: node -e "const fs=require('fs'); const v3=fs.readFileSync('src/js/feature-complete-v3.js','utf8'); const v4=fs.readFileSync('src/js/room-chat-rich.js','utf8'); if(v3.includes('LOCAL_STATS_KEY')) throw new Error('Undefined LOCAL_STATS_KEY reference remains.'); if(!v3.includes('watchHistory/')||!v3.includes('watchStats/')||!v3.includes('userSettings/')||!v3.includes('notifications/')||!v3.includes('presence/')) throw new Error('Cloud completion paths missing.'); if(!v4.includes('roomChatReplies')||!v4.includes('roomChatEdits')||!v4.includes('roomChatPins')||!v4.includes('roomChatReactions')) throw new Error('Room chat metadata paths missing.');"

      - name: Check feature center syntax
        run: node --check src/js/feature-center.js

      - name: Check i18n syntax
        run: node --check src/js/i18n.js

      - name: Check YouTube proxy syntax
        run: node --check youtube-proxy/server.js

      - name: Check YouTube Worker syntax
        run: node --check workers/youtube-search.js

      - name: Validate JSON files
        run: |
          node -e "JSON.parse(require('fs').readFileSync('config/database.rules.json','utf8')); JSON.parse(require('fs').readFileSync('firebase.json','utf8')); JSON.parse(require('fs').readFileSync('manifest.webmanifest','utf8')); console.log('JSON OK')"

      - name: Check Firebase Rules root structure
        run: |
          node - <<'NODE'
          const fs = require("fs");
          const parsed = JSON.parse(fs.readFileSync("config/database.rules.json", "utf8"));
          if (!parsed.rules || typeof parsed.rules !== "object") throw new Error("Firebase Rules root is missing.");
          if (parsed.rules.rules) throw new Error("Nested rules.rules root detected.");
          console.log("Firebase Rules root structure OK");
          NODE

      - name: Install rules test dependencies
        run: npm install --no-audit --no-fund

      - name: Run Realtime Database security rule tests
        run: npm run test:rules

      - name: Check for exposed YouTube API key
        run: |
          if grep -Eq 'AIza[0-9A-Za-z_-]{20,}' src/js/app.js workers/*.js; then
            echo 'Detected a Google API key in frontend/source files.'
            exit 1
          fi

      - name: Check for Popup API regression
        run: |
          if grep -Eq 'signInWithRedirect|linkWithRedirect' src/js/app.js; then
            echo 'Unexpected Redirect Auth API detected.'
            exit 1
          fi

      - name: Check six-character room code implementation
        run: |
          node -e "const fs=require('fs'); const app=fs.readFileSync('src/js/app.js','utf8'); const all=['src/js/app.js','index.html','src/js/enhancements.js'].map(f=>fs.readFileSync(f,'utf8')).join('\n'); if(!app.includes('new Uint32Array(\n        6\n      )')&&!/new Uint32Array\\(\\s*6\\s*\\)/s.test(app)){throw new Error('Six-character room code generator check failed.')} if(/6 或 12|12 碼房間|A-Z0-9\\{12\\}/.test(all)){throw new Error('Legacy 12-character room code validation detected.')} const e=fs.readFileSync('src/js/enhancements.js','utf8'); if(!e.includes('var FRIEND_CODE_RE = /^[A-Z0-9]{6}$/;')){throw new Error('Six-character friend code check failed.')} if(/FRIEND_CODE_RE.*\{8\}|8 碼好友代碼|好友代碼必須是 8/.test(e)){throw new Error('Legacy eight-character friend code detected.')} const rules=fs.readFileSync('config/database.rules.json','utf8'); if(/publicCode.*length === 8|\$code\.length === 8|fromCode.*length <= 8/.test(rules)){throw new Error('Legacy eight-character database rule detected.')} if(!/glass/.test(e)||!/retro/.test(e)||!/forest/.test(e)||!/blueprint/.test(e)){throw new Error('Formal theme IDs missing.')} console.log('Six-character room and friend code checks OK')"


      - name: Check synchronized room control architecture
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const app = fs.readFileSync('src/js/app.js', 'utf8');
          const enh = fs.readFileSync('src/js/enhancements.js', 'utf8');
          const rules = fs.readFileSync('config/database.rules.json', 'utf8');
          const index = fs.readFileSync('index.html', 'utf8');
          const sw = fs.readFileSync('sw.js', 'utf8');
          const featureV2 = fs.readFileSync('src/js/feature-completion-v2.js', 'utf8');
          const featureV3 = fs.readFileSync('src/js/feature-complete-v3.js', 'utf8');
          const featureV5 = fs.readFileSync('src/js/feature-complete-v5.js', 'utf8');
          if (/<input[^>]+id="videoSearchInput"|<button[^>]+id="videoSearchBtn"/.test(index)) throw new Error('Homepage video search UI regression detected.');
          if (!featureV2.includes('wt_platform_search_history_v2') || !featureV2.includes('wt_watch_history_v2')) throw new Error('Feature completion v2 history layer missing.');
          if (!rules.includes('roomChatReplies') || !rules.includes('roomChatEdits') || !rules.includes('roomChatPins') || !rules.includes('roomChatReactions')) throw new Error('Room chat rich rules missing.');
          if (!sw.includes('./src/js/feature-completion-v2.js')) throw new Error('Feature completion v2 is not precached.');
          if (!sw.includes('./src/js/feature-complete-v3.js')) throw new Error('Feature completion v3 is not precached.');
          if (!index.includes('feature-complete-v3.js')) throw new Error('Feature completion v3 is not loaded by the frontend.');
          if (!index.includes('feature-complete-v5.js')) throw new Error('Feature completion v5 is not loaded by the frontend.');
          if (!sw.includes('./src/js/feature-complete-v5.js')) throw new Error('Feature completion v5 is not precached.');
          if (!featureV3.includes('watchHistory') || !featureV3.includes('watchStats') || !featureV3.includes('notifications') || !featureV3.includes('presence') || !featureV3.includes('userSettings')) throw new Error('Feature completion v3 cloud layers are incomplete.');
          if (!featureV5.includes('roomCaptions/') || !featureV5.includes('WebVTT') || !featureV5.includes('navigator.onLine')) throw new Error('Feature completion v5 cloud caption layer missing.');
          const completion = fs.readFileSync('src/js/feature-completion.js', 'utf8');
          if (!completion.includes('sessions/') || !completion.includes('openSessionManager')) throw new Error('Cross-device session management is missing.');
          if (!rules.includes('"sessions"')) throw new Error('Session security rules are missing.');

          if (!app.includes('requestPlaybackControl(')) throw new Error('Member playback request function missing.');
          if (!app.includes('attachPlaybackControlRequestListener(')) throw new Error('Owner control-request listener missing.');
          if (!app.includes('空房房主接管失敗')) throw new Error('Vacant-room owner takeover flow missing.');
          if (!rules.includes('"controlRequests"')) throw new Error('controlRequests rules missing.');
          if (!rules.includes("root.child('members').child($roomId).child(auth.uid).exists()")) throw new Error('Owner takeover membership guard missing.');
          if (/numChildren\s*\(/.test(rules)) throw new Error('Unsupported numChildren() remains in Firebase rules.');
          if ((app.match(/function\s+scheduleQueueAdvanceAfterEnded\s*\(/g) || []).length !== 1) throw new Error('duplicate scheduleQueueAdvanceAfterEnded remains.');
          if (!app.includes('state.playbackLastPlayerState = "ended"')) throw new Error('Native ended-state guard missing.');
          if (!app.includes('buildYoutubeNativePlayer') || !app.includes('createYoutubeNativePlayer')) throw new Error('Native YouTube playback adapter is missing.');
          if (/new\s+YT\.Player|youtube\.com\/iframe_api|loadYoutubeIframeApi|createYoutubeIframePlayer/.test(app)) throw new Error('Legacy YouTube IFrame playback path remains.');
          if (!app.includes('loadVimeoSdk') || !app.includes('new Vimeo.Player')) throw new Error('Vimeo Player SDK integration is missing.');
          if (!app.includes('loadDailymotionSdk') || !app.includes('dailymotion.createPlayer') || !app.includes('dailymotion.events.VIDEO_SEEKEND')) throw new Error('Dailymotion Web SDK integration is missing.');
          if (!app.includes('loadTwitchSdk') || !app.includes('new Twitch.Player') || !app.includes('Twitch.Player.SEEK')) throw new Error('Twitch JavaScript Player integration is missing.');
          if (/randomCode\(12\)|length\s*={2,3}\s*12|randomCode\(8\)|length\s*={2,3}\s*8/.test(app + enh)) throw new Error('Legacy room/friend code length remains.');
          const appVersion = index.match(/app\.js\?v=([^"'&]+)/)?.[1];
          const enhVersion = index.match(/enhancements\.js\?v=([^"'&]+)/)?.[1];
          const cssVersion = index.match(/enhancements\.css\?v=([^"'&]+)/)?.[1];
          const swVersion = index.match(/sw\.js\?v=([^"'&]+)/)?.[1];
          const stylesVersion = index.match(/styles\.css\?v=([^"\'&]+)/)?.[1];
          const cacheVersion = sw.match(/wt-shell-(\d{8}-v[^"\s]+)/)?.[1];

          if (!appVersion || appVersion !== enhVersion || appVersion !== cssVersion || appVersion !== stylesVersion || appVersion !== swVersion) throw new Error('Frontend asset versions are not aligned.');
          if (cacheVersion !== appVersion.replace('formal-', '')) throw new Error('Service worker cache version is not aligned.');
          console.log('Synchronized room control architecture checks OK');
          NODE
      - name: Check Gemini AI request configuration
        run: |
          node - <<'NODE'
          const fs = require("fs");
          const server = fs.readFileSync("youtube-proxy/server.js", "utf8");
          if (!server.includes('responseMimeType: "application/json"')) throw new Error("Gemini JSON response MIME type is missing.");
          if (!server.includes('responseSchema: schema')) throw new Error("Gemini JSON response schema is missing.");
          if (!server.includes('thinkingConfig:')) throw new Error("Gemini thinkingConfig is missing.");
          if (!server.includes('thinkingLevel: isRepairPhase ? "high" : "medium"')) throw new Error("Gemini thinking levels are not configured.");
          if (!server.includes('function degradedAiResult(input, error)')) throw new Error("AI degraded-mode guard is missing.");
          if (!server.includes('degraded: true') || !server.includes('degraded: false')) throw new Error("AI degraded-mode response flags are missing.");
          console.log("Gemini AI request configuration checks OK");
          NODE

      - name: Check Gemini fallback implementation
        run: |
          node - <<'NODE'
          const fs = require("fs");
          const server = fs.readFileSync("youtube-proxy/server.js", "utf8");
          if (!server.includes("let usedModel = model;")) throw new Error("usedModel state is missing.");
          if (!server.includes("model: candidateModel")) throw new Error("Gemini fallback does not switch to candidate models.");
          if (!server.includes("usedModel = candidateModel;")) throw new Error("Fallback model is not captured.");
          if ((server.match(/const candidateModel of models/g) || []).length !== 1) throw new Error("Unexpected candidateModel loop count.");
          console.log("Gemini fallback implementation checks OK");
          NODE

      - name: Verify deployed Bug AI endpoint
        env:
          BUG_SERVICE_URL: https://watchtogether-youtube-proxy-2026.onrender.com
        run: |
          node - <<'NODE'
          const base = String(process.env.BUG_SERVICE_URL || "").replace(/\/+$/, "");
          const healthUrl = base + "/ai/health";
          const analyzeUrl = base + "/ai/analyze";

          const healthResponse = await fetch(healthUrl, {method: "GET"});
          const healthText = await healthResponse.text();
          let health = {};
          try { health = JSON.parse(healthText); } catch (_) {}
          const healthModel = String(health.model || "");
          const healthModelOk = healthModel.startsWith("gemini-3.") || healthModel.startsWith("gemini-2.5-");
          if (!healthResponse.ok || health.ok !== true || health.provider !== "gemini" || !healthModelOk) {
            throw new Error("Bug AI health verification failed: HTTP " + healthResponse.status + " " + healthText.slice(0, 500));
          }
          console.log("Bug AI service health verified:", JSON.stringify({ok:health.ok, provider:health.provider, model:health.model, repairModel:health.repairModel, configuredKeys:health.configuredKeys}));

          const probeId = "ci-ai-auth-gate-" + Date.now();
          const response = await fetch(analyzeUrl, {
            method: "POST",
            headers: {"Content-Type": "application/json"},
            body: JSON.stringify({phase:"detect",report:{category:"other",details:"CI authentication gate probe " + probeId,fingerprint:probeId,buildVersion:probeId,source:"ci",occurrences:1,createdAt:Date.now()},evidence:{liveErrorPresent:false},current:{healthy:true}})
          });
          const text = await response.text();
          let json = {};
          try { json = JSON.parse(text); } catch (_) {}
          if (response.status !== 401 || json.error !== "missing_auth_token") {
            throw new Error("Bug AI authentication gate verification failed: HTTP " + response.status + " " + text.slice(0, 500));
          }
          console.log("Bug AI authentication gate verified: unauthenticated analyze requests are rejected.");
          NODE

      - name: Deploy validated Firebase Realtime Database Rules
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
        run: |
          node - <<'NODE'
          const fs = require("fs");
          const raw = String(process.env.FIREBASE_SERVICE_ACCOUNT_JSON || "").trim();
          if (!raw) throw new Error("FIREBASE_SERVICE_ACCOUNT_JSON is not configured");
          const json = raw.startsWith("{")
            ? JSON.parse(raw)
            : JSON.parse(Buffer.from(raw, "base64").toString("utf8"));
          fs.writeFileSync("/tmp/watchtogether-firebase-service-account.json", JSON.stringify(json), {mode:0o600});
          NODE
          export GOOGLE_APPLICATION_CREDENTIALS=/tmp/watchtogether-firebase-service-account.json
          node_modules/.bin/firebase deploy --only database --project watchtogether-3f4f9 --json
          rm -f /tmp/watchtogether-firebase-service-account.json
