name: Validate WatchTogether

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check app.js syntax
        run: node --check app.js

      - name: Check enhancements.js syntax
        run: node --check enhancements.js

      - name: Check YouTube proxy syntax
        run: node --check youtube-proxy/server.js

      - name: Check YouTube Worker syntax
        run: node --check workers/youtube-search.js

      - name: Validate JSON files
        run: |
          node -e "JSON.parse(require('fs').readFileSync('database.rules.json','utf8')); JSON.parse(require('fs').readFileSync('firebase.json','utf8')); JSON.parse(require('fs').readFileSync('manifest.webmanifest','utf8')); console.log('JSON OK')"

      - name: Check for exposed YouTube API key
        run: |
          if grep -Eq 'AIza[0-9A-Za-z_-]{20,}' app.js workers/*.js; then
            echo 'Detected a Google API key in frontend/source files.'
            exit 1
          fi

      - name: Check for Popup API regression
        run: |
          if grep -Eq 'signInWithRedirect|linkWithRedirect' app.js; then
            echo 'Unexpected Redirect Auth API detected.'
            exit 1
          fi

      - name: Check six-character room code implementation
        run: |
          node -e "const fs=require('fs'); const app=fs.readFileSync('app.js','utf8'); const all=['app.js','index.html','enhancements.js'].map(f=>fs.readFileSync(f,'utf8')).join('\n'); if(!/new Uint32Array\\(\\s*6\\s*\\)/s.test(app)){throw new Error('Six-character room code generator check failed.')} if(/6 或 12|12 碼房間|A-Z0-9\\{12\\}/.test(all)){throw new Error('Legacy 12-character room code validation detected.')} const e=fs.readFileSync('enhancements.js','utf8'); if(!/FRIEND_CODE_RE\s*=\s*\/\^\[A-Z0-9\]\{6\}\$\//.test(e)){throw new Error('Six-character friend code check failed.')} if(/FRIEND_CODE_RE.*\{8\}|8 碼好友代碼|好友代碼必須是 8/.test(e)){throw new Error('Legacy eight-character friend code detected.')} const rules=fs.readFileSync('database.rules.json','utf8'); if(/publicCode.*length === 8|\$code\.length === 8|fromCode.*length <= 8/.test(rules)){throw new Error('Legacy eight-character database rule detected.')} if(!/glass/.test(e)||!/retro/.test(e)||!/forest/.test(e)||!/blueprint/.test(e)){throw new Error('Formal theme IDs missing.')} console.log('Six-character room and friend code checks OK')"
