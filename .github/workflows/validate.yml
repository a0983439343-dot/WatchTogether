name: Validate WatchTogether

on:
  push:
    branches:
      - main
    paths-ignore:
      - "ci-status/**"
  pull_request:
    branches:
      - main

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Java 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      - name: Check src/js/app.js syntax
        run: node --check src/js/app.js

      - name: Check src/js/enhancements.js syntax
        run: node --check src/js/enhancements.js

      - name: Check automatic bug monitor syntax
        run: node --check src/js/bug-monitor.js

      - name: Check src/js/chat.js syntax
        run: node --check src/js/chat.js

      - name: Check YouTube proxy syntax
        run: node --check youtube-proxy/server.js

      - name: Check YouTube Worker syntax
        run: node --check workers/youtube-search.js

      - name: Validate JSON files
        run: |
          node -e "JSON.parse(require('fs').readFileSync('config/database.rules.json','utf8')); JSON.parse(require('fs').readFileSync('firebase.json','utf8')); JSON.parse(require('fs').readFileSync('manifest.webmanifest','utf8')); console.log('JSON OK')"

      - name: Install rules test dependencies
        run: npm install --no-audit --no-fund

      - name: Run Realtime Database security rule tests
        run: npm run test:rules

      - name: Check for exposed YouTube API key
        run: |
          if grep -Eq 'AIza[0-9A-Za-z_-]{20,}' src/js/app.js workers/*.js; then
            echo 'Detected a Google API key in frontend/source files.'
            exit 1
          fi

      - name: Check for Popup API regression
        run: |
          if grep -Eq 'signInWithRedirect|linkWithRedirect' src/js/app.js; then
            echo 'Unexpected Redirect Auth API detected.'
            exit 1
          fi

      - name: Check six-character room code implementation
        run: |
          node -e "const fs=require('fs'); const app=fs.readFileSync('src/js/app.js','utf8'); const all=['src/js/app.js','index.html','src/js/enhancements.js'].map(f=>fs.readFileSync(f,'utf8')).join('\n'); if(!app.includes('new Uint32Array(\n        6\n      )')&&!/new Uint32Array\\(\\s*6\\s*\\)/s.test(app)){throw new Error('Six-character room code generator check failed.')} if(/6 或 12|12 碼房間|A-Z0-9\\{12\\}/.test(all)){throw new Error('Legacy 12-character room code validation detected.')} const e=fs.readFileSync('src/js/enhancements.js','utf8'); if(!e.includes('var FRIEND_CODE_RE = /^[A-Z0-9]{6}$/;')){throw new Error('Six-character friend code check failed.')} if(/FRIEND_CODE_RE.*\{8\}|8 碼好友代碼|好友代碼必須是 8/.test(e)){throw new Error('Legacy eight-character friend code detected.')} const rules=fs.readFileSync('config/database.rules.json','utf8'); if(/publicCode.*length === 8|\$code\.length === 8|fromCode.*length <= 8/.test(rules)){throw new Error('Legacy eight-character database rule detected.')} if(!/glass/.test(e)||!/retro/.test(e)||!/forest/.test(e)||!/blueprint/.test(e)){throw new Error('Formal theme IDs missing.')} console.log('Six-character room and friend code checks OK')"


      - name: Check synchronized room control architecture
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const app = fs.readFileSync('src/js/app.js', 'utf8');
          const enh = fs.readFileSync('src/js/enhancements.js', 'utf8');
          const rules = fs.readFileSync('config/database.rules.json', 'utf8');
          const index = fs.readFileSync('index.html', 'utf8');
          const sw = fs.readFileSync('sw.js', 'utf8');

          if (!app.includes('requestPlaybackControl(')) throw new Error('Member playback request function missing.');
          if (!app.includes('attachPlaybackControlRequestListener(')) throw new Error('Owner control-request listener missing.');
          if (!app.includes('空房房主接管失敗')) throw new Error('Vacant-room owner takeover flow missing.');
          if (!rules.includes('"controlRequests"')) throw new Error('controlRequests rules missing.');
          if (!rules.includes("root.child('members').child($roomId).child(auth.uid).exists()")) throw new Error('Owner takeover membership guard missing.');
          if (/numChildren\s*\(/.test(rules)) throw new Error('Unsupported numChildren() remains in Firebase rules.');
          if (!app.includes('buildYoutubeNativePlayer') || !app.includes('createYoutubeNativePlayer')) throw new Error('Native YouTube playback adapter is missing.');
          if (/new\s+YT\.Player|youtube\.com\/iframe_api|loadYoutubeIframeApi|createYoutubeIframePlayer/.test(app)) throw new Error('Legacy YouTube IFrame playback path remains.');
          if (!app.includes('loadVimeoSdk') || !app.includes('new Vimeo.Player')) throw new Error('Vimeo Player SDK integration is missing.');
          if (!app.includes('loadDailymotionSdk') || !app.includes('dailymotion.createPlayer') || !app.includes('dailymotion.events.VIDEO_SEEKEND')) throw new Error('Dailymotion Web SDK integration is missing.');
          if (!app.includes('loadTwitchSdk') || !app.includes('new Twitch.Player') || !app.includes('Twitch.Player.SEEK')) throw new Error('Twitch JavaScript Player integration is missing.');
          if (/randomCode\(12\)|length\s*={2,3}\s*12|randomCode\(8\)|length\s*={2,3}\s*8/.test(app + enh)) throw new Error('Legacy room/friend code length remains.');
          const appVersion = index.match(/app\.js\?v=([^"'&]+)/)?.[1];
          const enhVersion = index.match(/enhancements\.js\?v=([^"'&]+)/)?.[1];
          const cssVersion = index.match(/enhancements\.css\?v=([^"'&]+)/)?.[1];
          const swVersion = index.match(/sw\.js\?v=([^"'&]+)/)?.[1];
          const stylesVersion = index.match(/styles\.css\?v=([^"\'&]+)/)?.[1];
          const cacheVersion = sw.match(/wt-shell-(\d{8}-v[^"\s]+)/)?.[1];

          if (!appVersion || appVersion !== enhVersion || appVersion !== cssVersion || appVersion !== stylesVersion || appVersion !== swVersion) throw new Error('Frontend asset versions are not aligned.');
          if (cacheVersion !== appVersion.replace('formal-', '')) throw new Error('Service worker cache version is not aligned.');
          console.log('Synchronized room control architecture checks OK');
          NODE
      - name: Check Gemini AI request configuration
        run: |
          node - <<'NODE'
          const fs = require("fs");
          const server = fs.readFileSync("youtube-proxy/server.js", "utf8");
          if (!server.includes('responseMimeType: "application/json"')) throw new Error("Gemini JSON response MIME type is missing.");
          if (!server.includes('responseSchema: schema')) throw new Error("Gemini JSON response schema is missing.");
          if (!server.includes('thinkingConfig:')) throw new Error("Gemini thinkingConfig is missing.");
          if (!server.includes('thinkingLevel: isRepairPhase ? "high" : "medium"')) throw new Error("Gemini thinking levels are not configured.");
          if (!server.includes('function degradedAiResult(input, error)')) throw new Error("AI degraded-mode guard is missing.");
          if (!server.includes('degraded: true') || !server.includes('degraded: false')) throw new Error("AI degraded-mode response flags are missing.");
          console.log("Gemini AI request configuration checks OK");
          NODE

      - name: Verify deployed Bug AI endpoint
        env:
          BUG_SERVICE_URL: https://watchtogether-youtube-proxy-2026.onrender.com
        run: |
          node - <<'NODE'
          const url = String(process.env.BUG_SERVICE_URL || "").replace(/\/+$/, "") + "/ai/analyze";
          const payload = JSON.stringify({
            phase: "detect",
            report: {
              category: "other",
              details: "CI AI endpoint health check",
              fingerprint: "ci-ai-endpoint-health",
              buildVersion: "ci",
              source: "ci",
              occurrences: 1,
              createdAt: Date.now()
            },
            evidence: {
              liveErrorPresent: false,
              deployment: {
                source: "github-actions"
              }
            },
            current: {
              healthy: true,
              page: "https://a0983439343-dot.github.io/WatchTogether/"
            }
          });

          let last = "";
          for (let attempt = 1; attempt <= 15; attempt += 1) {
            const controller = new AbortController();
            const timeout = setTimeout(() => controller.abort(), 20_000);
            try {
              const response = await fetch(url, {
                method: "POST",
                headers: {"Content-Type": "application/json"},
                body: payload,
                signal: controller.signal
              });
              const text = await response.text();
              last = "HTTP " + response.status + " " + text.slice(0, 500);

              let json = {};
              try { json = JSON.parse(text); } catch (_) {}

              if (
                response.ok &&
                json.ok === true &&
                json.degraded !== true &&
                json.analysis &&
                /^gemini-3\./.test(String(json.model || ""))
              ) {
                console.log("Bug AI endpoint verified:", last);
                process.exit(0);
              }
            } catch (error) {
              last = String(error?.message || error);
            } finally {
              clearTimeout(timeout);
            }

            console.log("Bug AI endpoint not ready, attempt " + attempt + "/15:", last);
            await new Promise(resolve => setTimeout(resolve, 30_000));
          }

          throw new Error("Bug AI endpoint verification failed after 15 attempts: " + last);
          NODE

      - name: Deploy validated Firebase Realtime Database Rules
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
        run: |
          node - <<'NODE'
          const fs = require("fs");
          const raw = String(process.env.FIREBASE_SERVICE_ACCOUNT_JSON || "").trim();
          if (!raw) throw new Error("FIREBASE_SERVICE_ACCOUNT_JSON is not configured");
          const json = raw.startsWith("{")
            ? JSON.parse(raw)
            : JSON.parse(Buffer.from(raw, "base64").toString("utf8"));
          fs.writeFileSync("/tmp/watchtogether-firebase-service-account.json", JSON.stringify(json), {mode:0o600});
          NODE
          export GOOGLE_APPLICATION_CREDENTIALS=/tmp/watchtogether-firebase-service-account.json
          node_modules/.bin/firebase deploy --only database --project watchtogether-3f4f9 --json
          rm -f /tmp/watchtogether-firebase-service-account.json
