name: WatchTogether Sync Repair

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Normalize playback repair script
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('.github/scripts/repair_playback_v4.py')
          s = p.read_text(encoding='utf-8')
          start = s.find('# Add state used by the local-command debounce.')
          end = s.find('# There must be only one initial room-timeline recovery path.')
          if start >= 0 and end > start:
              s = s[:start] + s[end:]
              p.write_text(s, encoding='utf-8')
          PY

      - name: Apply shared playback timeline repair v4
        run: python3 .github/scripts/repair_playback_v4.py

      - name: Apply server clock repair
        run: python3 .github/scripts/fix_server_clock.py

      - name: Verify JavaScript
        run: |
          node --check app.js
          grep -q "function playbackClockNow()" app.js
          grep -q "function serverNow()" app.js
          grep -q "function attachServerClockSync()" app.js
          grep -q "SHARED ROOM TIMELINE PLAYBACK SYNC V4" app.js

      - name: Commit repaired app
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.js database.rules.json
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Fix shared playback timeline and latency sync"
            git push origin HEAD:main
          fi
