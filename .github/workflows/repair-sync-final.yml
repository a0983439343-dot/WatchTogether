name: WatchTogether Sync Repair

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Apply shared playback timeline repair v6
        run: python3 .github/scripts/repair_playback_v6.py

      - name: Apply server clock repair
        run: python3 .github/scripts/fix_server_clock.py

      - name: Verify JavaScript
        run: |
          node --check app.js
          grep -q "function playbackClockNow()" app.js
          grep -q "function serverNow()" app.js
          grep -q "function attachServerClockSync()" app.js
          grep -q "SHARED ROOM TIMELINE PLAYBACK SYNC V6" app.js

      - name: Commit repaired app
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.js database.rules.json
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Fix shared playback timeline and forced room state v6"
            git push origin HEAD:main
          fi
