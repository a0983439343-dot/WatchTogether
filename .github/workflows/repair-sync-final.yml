name: WatchTogether Sync Repair

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Apply sync repair
        run: python3 .github/scripts/repair_sync_final.py

      - name: Verify
        run: node --check app.js

      - name: Commit repaired app
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.js
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Automated WatchTogether sync repair"
            git push origin HEAD:main
          fi
