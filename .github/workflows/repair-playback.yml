name: Repair WatchTogether Playback Sync

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  repair:
    if: ${{ !startsWith(github.event.head_commit.message, 'Automated playback sync repair') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Apply playback repair
        run: python3 .github/scripts/repair_playback_v2.py

      - name: Ensure late joiner timeline recovery
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("app.js")
          text = path.read_text(encoding="utf-8")
          old = '''                  startLocalTimeUpdate();\n\n\n                  setTimeout(\n                    forceYoutubeVisible,\n                    100\n                  );'''
          new = '''                  startLocalTimeUpdate();\n\n                  await applyLatestRoomPlaybackState(true);\n                  await reconcileRoomTimeline();\n\n                  setTimeout(\n                    forceYoutubeVisible,\n                    100\n                  );'''
          if "await applyLatestRoomPlaybackState(true);\n                  await reconcileRoomTimeline();" not in text:
              if old not in text:
                  raise SystemExit("YouTube onReady late-joiner marker not found")
              text = text.replace(old, new, 1)
              path.write_text(text, encoding="utf-8")
          print("Late-joiner room timeline safeguard verified.")
          PY

      - name: Verify JavaScript and Firebase rules
        run: |
          test -s app.js
          test -s database.rules.json
          node --check app.js
          python3 -m py_compile .github/scripts/repair_playback_v2.py
          python3 -m json.tool database.rules.json > /dev/null
          grep -q "function playbackSyncRef" app.js
          grep -q "function publishPlaybackEvent" app.js
          grep -q "function applyLatestRoomPlaybackState" app.js
          grep -q "function attachPlaybackSyncListener" app.js
          grep -q "playbackEvent" database.rules.json
          grep -q "await applyLatestRoomPlaybackState(true)" app.js
          grep -q "await reconcileRoomTimeline()" app.js
          ! grep -q '\\n  /\\*' app.js
          git diff --check
          echo "Playback sync repair verification passed."

      - name: Commit repaired files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.js database.rules.json
          if git diff --cached --quiet; then
            echo "No playback repair changes needed."
            exit 0
          fi
          git commit -m "Automated playback sync repair"
          git push origin HEAD:main
