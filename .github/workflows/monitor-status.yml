name: Record 24-7 Monitor Status

on:
  workflow_run:
    workflows:
      - WatchTogether 24/7 Bug Monitor
    types:
      - completed

permissions:
  contents: write

jobs:
  record:
    if: github.event.workflow_run.event == 'push' && github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Record monitor result
        env:
          RUN_ID: ${{ github.event.workflow_run.id }}
          RUN_NUMBER: ${{ github.event.workflow_run.run_number }}
          CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          HTML_URL: ${{ github.event.workflow_run.html_url }}
          UPDATED_AT: ${{ github.event.workflow_run.updated_at }}
        run: |
          mkdir -p ci-status
          node - <<'NODE'
          const fs = require("fs");
          const data = {
            workflow: "WatchTogether 24/7 Bug Monitor",
            runId: Number(process.env.RUN_ID),
            runNumber: Number(process.env.RUN_NUMBER),
            conclusion: process.env.CONCLUSION,
            headSha: process.env.HEAD_SHA,
            url: process.env.HTML_URL,
            updatedAt: process.env.UPDATED_AT
          };
          fs.writeFileSync("ci-status/monitor-latest.json", JSON.stringify(data, null, 2) + "\n");
          NODE

          git config user.name "WatchTogether CI"
          git config user.email "watchtogether-ci@users.noreply.github.com"
          git add ci-status/monitor-latest.json
          git diff --cached --quiet && exit 0
          git commit -m "ci: record monitor status"
          git push origin HEAD:main
