name: Deploy Firebase Rules after Validation

on:
  workflow_run:
    workflows:
      - Validate WatchTogether
    types:
      - completed

permissions:
  contents: read

jobs:
  deploy:
    if: github.event.workflow_run.event == 'push' && github.event.workflow_run.head_branch == 'main' && github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout validated commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install Firebase CLI
        run: npm install --no-audit --no-fund

      - name: Prepare Firebase credentials
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
        run: |
          node - <<'NODE'
          const fs = require("fs");
          const raw = String(process.env.FIREBASE_SERVICE_ACCOUNT_JSON || "").trim();
          if (!raw) throw new Error("FIREBASE_SERVICE_ACCOUNT_JSON is not configured");
          const json = raw.startsWith("{")
            ? JSON.parse(raw)
            : JSON.parse(Buffer.from(raw, "base64").toString("utf8"));
          fs.writeFileSync("/tmp/watchtogether-firebase-service-account.json", JSON.stringify(json), {mode: 0o600});
          NODE

      - name: Deploy Realtime Database Rules
        env:
          GOOGLE_APPLICATION_CREDENTIALS: /tmp/watchtogether-firebase-service-account.json
        run: |
          node_modules/.bin/firebase deploy --only database --project watchtogether-3f4f9 --json

      - name: Remove Firebase credentials
        if: always()
        run: rm -f /tmp/watchtogether-firebase-service-account.json
