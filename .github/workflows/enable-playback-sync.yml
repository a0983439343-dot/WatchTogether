name: Enable WatchTogether Playback Sync

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, 'Enable event playback sync') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch app.js
        run: python3 .github/scripts/patch_playback_sync.py

      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet -- app.js; then
            echo "No app.js changes needed"
            exit 0
          fi
          git add app.js
          git commit -m "Enable event playback sync"
          git push
