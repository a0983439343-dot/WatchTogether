name: Repair WatchTogether Playback Sync

on:
  push:
    branches:
      - main
  pull_request:
    types:
      - opened
      - synchronize
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair:
    if: ${{ github.event_name != 'push' || !contains(github.event.head_commit.message, 'Restore and fix playback sync') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.head_ref || github.ref }}

      - name: Stop if repair already applied
        id: guard
        shell: bash
        run: |
          if [ -f .github/repair-done ]; then
            echo "done=true" >> "$GITHUB_OUTPUT"
          else
            echo "done=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Restore known-good app.js
        if: steps.guard.outputs.done != 'true'
        run: git show b4db178f131b543a41354ccbf10a20e2b4bb4296:app.js > app.js

      - name: Apply playback sync patch
        if: steps.guard.outputs.done != 'true'
        run: python3 .github/scripts/patch_playback_sync.py

      - name: Apply member-owned playback state patch
        if: steps.guard.outputs.done != 'true'
        run: python3 .github/scripts/patch_members_playback_sync.py

      - name: Verify JavaScript and sync wiring
        if: steps.guard.outputs.done != 'true'
        run: |
          test -s app.js
          grep -q "function attachPlaybackSyncListener()" app.js
          grep -q "function playbackSyncRef()" app.js
          grep -q "function playbackWriteRef()" app.js
          grep -q "playbackState" app.js
          grep -q "state.membersRef" app.js
          ! grep -q 'playbackEvent' app.js
          ! grep -q "schedulePlayingPositionSync" app.js
          node --check app.js

      - name: Verify HTML, CSS, JSON and storage rules
        if: steps.guard.outputs.done != 'true'
        run: |
          node -e "const fs=require('fs'); const html=fs.readFileSync('index.html','utf8'); if(!html.includes('app.js')) process.exit(1); if(!html.includes('firebase-config.js')) process.exit(1); if(!html.includes('id=\"youtubePlayer\"')) process.exit(1);"
          node -e "const fs=require('fs'); const css=fs.readFileSync('styles.css','utf8'); if(!css.trim()) process.exit(1);"
          node -e "JSON.parse(fs.readFileSync('database.rules.json','utf8')); JSON.parse(fs.readFileSync('firebase.json','utf8'));"
          node -e "const fs=require('fs'); const rules=fs.readFileSync('storage.rules','utf8'); if(!rules.includes(\"rules_version = '2'\")) process.exit(1); if(!rules.includes('service firebase.storage')) process.exit(1);"

      - name: Mark repair complete
        if: steps.guard.outputs.done != 'true'
        run: echo "Playback sync repair verified" > .github/repair-done

      - name: Commit repaired project
        if: steps.guard.outputs.done != 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.js .github/repair-done
          git commit -m "Restore and fix playback sync"
          git push origin HEAD:${{ github.head_ref || 'main' }}
