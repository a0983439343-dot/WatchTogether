name: Record Firebase Rules Deploy Status

on:
  workflow_run:
    workflows:
      - Deploy Firebase Rules after Validation
    types:
      - completed

permissions:
  contents: write

jobs:
  record:
    if: github.event.workflow_run.event == 'workflow_run'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Record Firebase deploy result
        env:
          RUN_ID: ${{ github.event.workflow_run.id }}
          RUN_NUMBER: ${{ github.event.workflow_run.run_number }}
          CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          HTML_URL: ${{ github.event.workflow_run.html_url }}
          UPDATED_AT: ${{ github.event.workflow_run.updated_at }}
        run: |
          mkdir -p ci-status
          node - <<'NODE'
          const fs = require("fs");
          const data = {
            workflow: "Deploy Firebase Rules after Validation",
            runId: Number(process.env.RUN_ID),
            runNumber: Number(process.env.RUN_NUMBER),
            conclusion: process.env.CONCLUSION,
            headSha: process.env.HEAD_SHA,
            url: process.env.HTML_URL,
            updatedAt: process.env.UPDATED_AT
          };
          fs.writeFileSync("ci-status/firebase-deploy-latest.json", JSON.stringify(data, null, 2) + "\n");
          NODE

          git config user.name "WatchTogether CI"
          git config user.email "watchtogether-ci@users.noreply.github.com"
          git add ci-status/firebase-deploy-latest.json
          git diff --cached --quiet && exit 0
          git commit -m "ci: record firebase deploy status"
          git push origin HEAD:main
