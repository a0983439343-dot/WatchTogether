name: Stable playback authority repair

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install room authority
        run: python3 .github/scripts/install_playback_v12.py

      - name: Harden YouTube callbacks
        run: python3 .github/scripts/harden_playback_v13.py

      - name: Install single-timeline authority v14
        run: python3 .github/scripts/room_authority_v14.py

      - name: Validate JavaScript
        run: |
          node --check app.js
          grep -q 'ROOM AUTHORITY PLAYBACK V12' app.js
          grep -q 'ROOM AUTHORITY PLAYBACK V14' app.js
          grep -q 'state.roomAuthorityV12' app.js
          grep -q 'state.roomAuthorityV14' app.js
          grep -q 'roomAuthorityCommandV14' app.js
          grep -q 'roomAuthorityExpectedV14' app.js
          grep -q 'roomAuthorityStartObserverV14' app.js

      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app.js
          if git diff --cached --quiet; then
            echo 'No changes'
          else
            git commit -m 'Install single-timeline authoritative playback v14'
            git push origin HEAD:main
          fi
