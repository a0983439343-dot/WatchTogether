name: Record Autonomous Repair Status

on:
  workflow_run:
    workflows:
      - WatchTogether Autonomous Repair
    types:
      - completed

permissions:
  contents: write

concurrency:
  group: watchtogether-repair-status
  cancel-in-progress: false

jobs:
  record:
    if: (github.event.workflow_run.event == 'schedule' || github.event.workflow_run.event == 'workflow_dispatch') && github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Record repair result
        env:
          RUN_ID: ${{ github.event.workflow_run.id }}
          RUN_NUMBER: ${{ github.event.workflow_run.run_number }}
          CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          HTML_URL: ${{ github.event.workflow_run.html_url }}
          UPDATED_AT: ${{ github.event.workflow_run.updated_at }}
        run: |
          mkdir -p ci-status
          node - <<'NODE'
          const fs = require("fs");
          const data = {
            workflow: "WatchTogether Autonomous Repair",
            runId: Number(process.env.RUN_ID),
            runNumber: Number(process.env.RUN_NUMBER),
            conclusion: process.env.CONCLUSION,
            headSha: process.env.HEAD_SHA,
            url: process.env.HTML_URL,
            updatedAt: process.env.UPDATED_AT
          };
          fs.writeFileSync("ci-status/repair-latest.json", JSON.stringify(data, null, 2) + "\n");
          NODE

          git config user.name "WatchTogether CI"
          git config user.email "watchtogether-ci@users.noreply.github.com"
          git add ci-status/repair-latest.json
          git diff --cached --quiet && exit 0
          git commit -m "ci: record autonomous repair status"
          git push origin HEAD:main
