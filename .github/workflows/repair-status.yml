name: Record Autonomous Repair Status

on:
  workflow_run:
    workflows:
      - WatchTogether Autonomous Repair
    types:
      - completed

permissions:
  contents: read

concurrency:
  group: watchtogether-repair-status
  cancel-in-progress: false

jobs:
  record:
    if: (github.event.workflow_run.event == 'schedule' || github.event.workflow_run.event == 'workflow_dispatch') && github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Record repair result
        env:
          RUN_ID: ${{ github.event.workflow_run.id }}
          RUN_NUMBER: ${{ github.event.workflow_run.run_number }}
          CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          HTML_URL: ${{ github.event.workflow_run.html_url }}
          UPDATED_AT: ${{ github.event.workflow_run.updated_at }}
        run: |
          {
            echo "## WatchTogether Autonomous Repair"
            echo "- Run: #$RUN_NUMBER"
            echo "- Conclusion: $CONCLUSION"
            echo "- Commit: $HEAD_SHA"
            echo "- Updated: $UPDATED_AT"
            echo "- URL: $HTML_URL"
          } >> "$GITHUB_STEP_SUMMARY"
