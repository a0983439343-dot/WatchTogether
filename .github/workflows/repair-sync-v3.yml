name: Repair playback sync v3

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Patch shared playback engine
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          path = Path('app.js')
          s = path.read_text(encoding='utf-8')
          changed = False

          if 'playbackLocalStateCandidate: null' not in s:
              marker = '    playbackUiBridgeBound: false,'
              if marker not in s:
                  raise SystemExit('state marker not found')
              s = s.replace(
                  marker,
                  marker + '\n\n    playbackLocalStateCandidate: null,\n    playbackLocalStateCandidateAt: 0,',
                  1
              )
              changed = True

          s2 = s.replace(
              'state.playbackIgnoreStateUntil = Date.now() + 8000;',
              'state.playbackIgnoreStateUntil = Date.now() + 2500;',
              1
          )
          if s2 != s:
              s = s2
              changed = True

          # Replace the immediate state-change publisher with a short
          # confirmation window. This prevents buffering/ad feedback from
          # becoming a room-wide pause while preserving real user pauses.
          pattern = re.compile(
              r'(?P<indent>\s*)if \(\s*'
              r'state\.playbackLastPlaying !== null &&\s*'
              r'playing !== state\.playbackLastPlaying &&\s*'
              r'roomPlaying !== null &&\s*'
              r'playing !== roomPlaying\s*'
              r'\) \{.*?\n(?P=indent)\}\n',
              re.S
          )
          m = pattern.search(s)
          if m:
              old = m.group(0)
              indent = m.group('indent')
              new = f'''{indent}if (\n{indent}  state.playbackLastPlaying !== null &&\n{indent}  playing !== state.playbackLastPlaying &&\n{indent}  roomPlaying !== null &&\n{indent}  playing !== roomPlaying\n{indent}) {{\n{indent}  if (state.playbackLocalStateCandidate !== playing) {{\n{indent}    state.playbackLocalStateCandidate = playing;\n{indent}    state.playbackLocalStateCandidateAt = now;\n{indent}  }} else if (\n{indent}    now - Number(state.playbackLocalStateCandidateAt || 0) >= 450\n{indent}  ) {{\n{indent}    state.playbackLocalIntentAt = now;\n{indent}    void publishPlaybackEvent(\n{indent}      playing ? "play" : "pause",\n{indent}      position\n{indent}    );\n\n{indent}    state.playbackLocalStateCandidate = null;\n{indent}    state.playbackLocalStateCandidateAt = 0;\n\n{indent}    state.playbackLastPosition = position;\n{indent}    state.playbackLastPlaying = playing;\n{indent}    state.playbackLastPlayerState = playing ? "playing" : "paused";\n{indent}    state.playbackLastObservedPosition = position;\n{indent}    return;\n{indent}  }}\n{indent}}} else {{\n{indent}  state.playbackLocalStateCandidate = null;\n{indent}  state.playbackLocalStateCandidateAt = 0;\n{indent}}}\n'''
              if old != new:
                  s = s[:m.start()] + new + s[m.end():]
                  changed = True

          # Late joiners and recreated players must pull the latest room
          # command after the player is ready.
          recovery_call = '''    setTimeout(() => {\n      void applyLatestRoomPlaybackState();\n    }, 180);\n\n'''
          detector_marker = '    state.playbackSeekTimer = setInterval(async () => {'
          if 'void applyLatestRoomPlaybackState();' not in s:
              idx = s.find(detector_marker)
              if idx < 0:
                  raise SystemExit('seek detector marker not found')
              s = s[:idx] + recovery_call + s[idx:]
              changed = True

          # The three visible room controls are authoritative room commands.
          # Cloning removes the old local-only click handlers without changing
          # the HTML or appearance.
          if 'function installAuthoritativeControlBridge()' not in s:
              bridge = r'''
  /*
   * =========================================================
   * AUTHORITATIVE CONTROL BRIDGE
   * =========================================================
   *
   * 房間控制列直接寫入共享 room timeline。
   * 沒有任何 master player。
   */

  function replaceControlButton(id, handler) {
    const oldButton = $(id);

    if (!oldButton) {
      return null;
    }

    const newButton = oldButton.cloneNode(true);
    oldButton.replaceWith(newButton);
    newButton.addEventListener("click", handler);
    return newButton;
  }


  function installAuthoritativeControlBridge() {
    if (state.playbackUiBridgeBound) {
      return;
    }

    const ready = () =>
      Boolean(state.playerReady && state.player && state.currentVideoId);

    replaceControlButton("playPauseBtn", async () => {
      if (!ready() || state.playbackApplyingRemote || state.playbackPendingRecovery) {
        return;
      }

      try {
        const before = await asyncIsPlaying();
        const targetPlaying = !before;
        const now = Date.now();

        state.playbackUserActionUntil = now + 1800;
        state.playbackUserActionKind = targetPlaying ? "play" : "pause";
        state.playbackLocalIntentAt = now;
        state.playbackLocalStateCandidate = null;
        state.playbackLocalStateCandidateAt = 0;

        if (targetPlaying) {
          await playPlayer();
        } else {
          await pausePlayer();
        }

        const position = await asyncCurrentPosition();
        await publishPlaybackEvent(
          targetPlaying ? "play" : "pause",
          position
        );

        state.playbackLastPosition = position;
        state.playbackLastPlaying = targetPlaying;
        state.playbackLastPlayerState = targetPlaying ? "playing" : "paused";
        state.playbackLastObservedPosition = position;
        updateTimeUI();
      } catch (error) {
        console.warn("播放按鈕同步失敗:", error);
      }
    });

    replaceControlButton("backBtn", async () => {
      if (!ready() || state.playbackApplyingRemote || state.playbackPendingRecovery) {
        return;
      }

      try {
        const current = await asyncCurrentPosition();
        const playing = await asyncIsPlaying();
        const target = Math.max(0, current - 10);

        state.playbackUserActionUntil = Date.now() + 1800;
        state.playbackUserActionKind = "seek";
        state.playbackLocalIntentAt = Date.now();
        state.playbackLocalStateCandidate = null;
        state.playbackLocalStateCandidateAt = 0;

        await applyPlayerPosition(target);
        await publishPlaybackEvent("seek", target);

        state.playbackLastPosition = target;
        state.playbackLastPlaying = playing;
        state.playbackLastPlayerState = playing ? "playing" : "paused";
        state.playbackLastObservedPosition = target;
        updateTimeUI();
      } catch (error) {
        console.warn("倒退同步失敗:", error);
      }
    });

    replaceControlButton("forwardBtn", async () => {
      if (!ready() || state.playbackApplyingRemote || state.playbackPendingRecovery) {
        return;
      }

      try {
        const current = await asyncCurrentPosition();
        const playing = await asyncIsPlaying();
        const target = Math.max(0, current + 10);

        state.playbackUserActionUntil = Date.now() + 1800;
        state.playbackUserActionKind = "seek";
        state.playbackLocalIntentAt = Date.now();
        state.playbackLocalStateCandidate = null;
        state.playbackLocalStateCandidateAt = 0;

        await applyPlayerPosition(target);
        await publishPlaybackEvent("seek", target);

        state.playbackLastPosition = target;
        state.playbackLastPlaying = playing;
        state.playbackLastPlayerState = playing ? "playing" : "paused";
        state.playbackLastObservedPosition = target;
        updateTimeUI();
      } catch (error) {
        console.warn("快轉同步失敗:", error);
      }
    });

    state.playbackUiBridgeBound = true;
  }

'''
              room_marker = re.search(r'\n\s*/\*\s*={5,}\s*\n\s*ROOM UI', s)
              if not room_marker:
                  raise SystemExit('room UI section marker not found')
              s = s[:room_marker.start()] + '\n' + bridge + s[room_marker.start():]
              changed = True

          if 'installAuthoritativeControlBridge();' not in s:
              match = re.search(r'\n\}\)\(\);\s*$', s)
              if not match:
                  raise SystemExit('IIFE tail not found')
              s = s[:match.start()] + '\n\n  installAuthoritativeControlBridge();\n' + s[match.start():]
              changed = True

          if changed:
              path.write_text(s, encoding='utf-8')
          print('playback v3 patch complete' if changed else 'playback v3 already applied')
          PY

      - name: Validate JavaScript
        shell: bash
        run: node --check app.js

      - name: Verify required playback markers
        shell: bash
        run: |
          grep -q 'function installAuthoritativeControlBridge' app.js
          grep -q 'playbackLocalStateCandidate' app.js
          grep -q 'playbackTimeline' app.js
          grep -q 'void applyLatestRoomPlaybackState();' app.js

      - name: Commit repair
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.js
          if git diff --cached --quiet; then
            echo "No changes needed"
            exit 0
          fi
          git commit -m "Harden authoritative playback controls and late-join sync"
          git push